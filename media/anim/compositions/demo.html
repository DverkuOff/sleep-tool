  <script>
    const tl = gsap.timeline({ paused: true });
    const IN = { opacity: 0, filter: "blur(8px)" };
    const LANDED = { opacity: 1, filter: "blur(0px)" };

    // Курсор. x и y на разных кривых, поэтому путь чуть изогнут, как у руки.
    let cur = { x: 1500, y: 880 };
    function move(t, x, y, dur, ex = "power2.inOut", ey = "power2.inOut") {
      const seg = { t, dur, x0: cur.x, y0: cur.y, x1: x, y1: y, ex, ey };
      tl.to("#cursor", { x, duration: dur, ease: ex }, t);
      tl.to("#cursor", { y, duration: dur, ease: ey }, t);
      cur = { x, y };
      return seg;
    }
    // Момент, когда курсор пересекает границу по оси: для подсветки пунктов меню
    function crossAt(seg, axis, value) {
      const e = gsap.parseEase(axis === "x" ? seg.ex : seg.ey);
      const a = axis === "x" ? seg.x0 : seg.y0;
      const b = axis === "x" ? seg.x1 : seg.y1;
      for (let i = 0; i <= 400; i++) {
        const v = a + (b - a) * e(i / 400);
        if ((b > a && v >= value) || (b < a && v <= value)) return seg.t + (i / 400) * seg.dur;
      }
      return seg.t + seg.dur;
    }
    function click(t) {
      tl.fromTo("#cursor-img", { scale: 1 }, { scale: 0.9, duration: 0.06, ease: "power2.out", transformOrigin: "11px 11px", immediateRender: false }, t);
      tl.to("#cursor-img", { scale: 1, duration: 0.12, ease: "power2.out" }, t + 0.06);
    }
    const on = (sel, t) => tl.set(sel, { opacity: 1 }, t);
    const off = (sel, t) => tl.set(sel, { opacity: 0 }, t);
    function openMenu(sel, t, first) {
      tl.fromTo(sel, { opacity: 0, scale: 0.96 }, { opacity: 1, scale: 1, duration: 0.18, ease: "expo.out", transformOrigin: "0% 0%", immediateRender: first }, t);
    }

    // 0–1.8 с: заголовок, исходное состояние и команда печатается
    tl.fromTo("#eyebrow", IN, { ...LANDED, duration: 0.2, ease: "power4.out" }, 0.2);
    tl.fromTo("#hero-pill", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.7, ease: "expo.out" }, 0.35);
    tl.fromTo(["#w-son", "#w-swap"], { opacity: 0, filter: "blur(6px)" }, { ...LANDED, duration: 0.13, ease: "power2.out", stagger: 0.067 }, 0.5);
    tl.fromTo("#mono .prompt", { opacity: 0 }, { opacity: 1, duration: 0.15, ease: "power2.out" }, 0.85);
    tl.fromTo("#typed", { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: 0.85, ease: "steps(28)" }, 0.95);

    // 1.4–2.3 с: курсор к таблетке, клик, меню
    tl.set("#cursor", { x: cur.x, y: cur.y }, 0);
    tl.fromTo("#cursor", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power2.out" }, 1.4);
    move(1.45, 1206, 42, 0.85, "power2.inOut", "power3.inOut");
    click(2.35);
    on("#pill-hl", 2.37);
    openMenu("#menu", 2.39, true);

    // 2.7–3.8 с: «Запретить сон», клик, пункт мигает, меню закрывается
    const toToggle = move(2.7, 1330, 183, 0.45);
    on("#hl-toggle", crossAt(toToggle, "y", 158));
    click(3.45);
    off("#hl-toggle", 3.5);
    on("#hl-toggle", 3.57);
    tl.to("#menu", { opacity: 0, duration: 0.14, ease: "power2.in" }, 3.64);
    off("#pill-hl", 3.78);
    off("#hl-toggle", 3.8);

    // 3.8 с: сон запрещён. Таблетка поворачивается и пружинит, слово и цифра меняются
    tl.fromTo("#bar-pill", { rotation: 0 }, { rotation: 90, duration: 0.45, ease: "back.out(1.8)" }, 3.8);
    tl.fromTo("#hero-pill-svg", { rotation: 0 }, { rotation: 90, duration: 0.6, ease: "back.out(1.5)" }, 3.8);
    tl.fromTo("#hero-pill-svg", { scale: 1 }, { scale: 1.08, duration: 0.14, ease: "power2.out", immediateRender: false }, 3.8);
    tl.to("#hero-pill-svg", { scale: 1, duration: 0.5, ease: "elastic.out(1, 0.5)" }, 3.94);
    tl.to("#w-off", { opacity: 0, filter: "blur(8px)", duration: 0.13, ease: "power2.in" }, 3.8);
    tl.fromTo("#w-on", IN, { ...LANDED, duration: 0.16, ease: "power3.out" }, 3.9);
    tl.fromTo("#roll-col", { yPercent: 0 }, { yPercent: -50, duration: 0.28, ease: "power3.out" }, 3.85);
    tl.fromTo("#glow-a", { opacity: 0.55 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 3.8);
    tl.fromTo("#cap-a", IN, { ...LANDED, duration: 0.2, ease: "power4.out" }, 4.35);

    // 5–8.3 с: снова меню, «Запретить на время» → подменю → «1 час»
    off(["#st-off", "#tg-off"], 5.0);
    on(["#st-on", "#tg-on"], 5.0);
    move(5.25, 1206, 42, 0.55, "power2.inOut", "power3.inOut");
    click(5.85);
    on("#pill-hl", 5.87);
    openMenu("#menu", 5.89, false);
    const toTimed = move(6.2, 1360, 233, 0.45);
    on("#hl-toggle", crossAt(toTimed, "y", 158));
    off("#hl-toggle", crossAt(toTimed, "y", 208));
    on("#hl-timed", crossAt(toTimed, "y", 208));
    openMenu("#submenu", 6.85, true);
    const intoSub = move(7.0, 1740, 233, 0.4);
    on("#hl-15", crossAt(intoSub, "x", 1630));
    const downSub = move(7.4, 1745, 333, 0.35);
    off("#hl-15", crossAt(downSub, "y", 256));
    on("#hl-30", crossAt(downSub, "y", 256));
    off("#hl-30", crossAt(downSub, "y", 306));
    on("#hl-hour", crossAt(downSub, "y", 306));
    click(7.95);
    off("#hl-hour", 8.0);
    on("#hl-hour", 8.07);
    tl.to(["#menu", "#submenu"], { opacity: 0, duration: 0.14, ease: "power2.in" }, 8.12);
    off("#pill-hl", 8.28);
    off(["#hl-timed", "#hl-hour"], 8.3);

    // 8.15 с: плашка «до 17:07» вылетает из пункта «1 час» и встаёт в строку
    const CHIP_FROM = { x: 494, y: -242 }; // «1 час» (1710, 332) минус центр плашки на месте (1216, 574)
    tl.set("#chip", { x: CHIP_FROM.x, y: CHIP_FROM.y, scale: 0.5 }, 0);
    tl.fromTo("#chip", { opacity: 0 }, { opacity: 1, duration: 0.15, ease: "power2.out" }, 8.15);
    tl.to("#chip", { x: 0, y: 0, scale: 1, duration: 0.65, ease: "power3.inOut" }, 8.15);
    tl.fromTo("#chip", { filter: "blur(0px)" }, { filter: "blur(6px)", duration: 0.3, ease: "power2.in", immediateRender: false }, 8.15);
    tl.to("#chip", { filter: "blur(0px)", duration: 0.35, ease: "power2.out" }, 8.45);
    tl.to("#cap-a", { opacity: 0, filter: "blur(8px)", duration: 0.15, ease: "power2.in" }, 8.35);
    tl.fromTo("#cap-b", IN, { ...LANDED, duration: 0.2, ease: "power4.out" }, 8.5);

    // 8.9 с: курсор уходит, дальше кадр держится до конца
    tl.to("#cursor", { opacity: 0, x: 1560, y: 560, duration: 0.45, ease: "power3.in" }, 8.9);

    window.__timelines["demo"] = tl;
  </script>
