  <script>
    const tl = gsap.timeline({ paused: true });
    const IN = { opacity: 0, filter: "blur(8px)" };
    const LANDED = { opacity: 1, filter: "blur(0px)" };

    // Нажатие кнопки мыши: стрелка чуть сжимается и возвращается
    function click(t) {
      tl.fromTo("#cursor-svg", { scale: 1 }, { scale: 0.86, duration: 0.06, ease: "power2.out", transformOrigin: "0% 0%", immediateRender: false }, t);
      tl.to("#cursor-svg", { scale: 1, duration: 0.12, ease: "power2.out" }, t + 0.06);
    }

    // 0–1.2 с: заголовок и исходное состояние «Сон разрешён»
    tl.fromTo("#eyebrow", IN, { ...LANDED, duration: 0.2, ease: "power4.out" }, 0.25);
    tl.fromTo("#hero-pill", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.7, ease: "expo.out" }, 0.35);
    tl.fromTo(["#w-son", "#w-swap"], { opacity: 0, filter: "blur(6px)" }, { ...LANDED, duration: 0.13, ease: "power2.out", stagger: 0.067 }, 0.5);
    tl.fromTo("#mono", IN, { ...LANDED, duration: 0.2, ease: "power4.out" }, 0.9);

    // 1.35–2.3 с: курсор к таблетке в строке меню
    tl.fromTo("#cursor", { opacity: 0, x: 1640, y: 860 }, { opacity: 1, duration: 0.25, ease: "power2.out" }, 1.35);
    tl.to("#cursor", { x: 1394, y: 42, duration: 0.85, ease: "power3.inOut" }, 1.45);

    // 2.35 с: клик, меню открывается
    click(2.35);
    tl.set("#pill-hl", { opacity: 1 }, 2.38);
    tl.fromTo("#menu", { opacity: 0, y: -6 }, { opacity: 1, y: 0, duration: 0.14, ease: "expo.out" }, 2.4);

    // 2.75–3.8 с: «Запретить сон», клик, пункт мигает, меню закрывается
    tl.to("#cursor", { x: 1530, y: 183, duration: 0.45, ease: "power2.inOut" }, 2.75);
    tl.set("#hl-toggle", { opacity: 1 }, 3.08);
    click(3.45);
    tl.set("#hl-toggle", { opacity: 0 }, 3.5);
    tl.set("#hl-toggle", { opacity: 1 }, 3.57);
    tl.to("#menu", { opacity: 0, duration: 0.14, ease: "power2.in" }, 3.64);
    tl.set("#pill-hl", { opacity: 0 }, 3.78);
    tl.set("#hl-toggle", { opacity: 0 }, 3.8);

    // 3.8 с: сон запрещён — таблетка поворачивается, слово и цифра меняются
    tl.fromTo("#bar-pill", { rotation: 0 }, { rotation: 90, duration: 0.45, ease: "back.out(1.8)" }, 3.8);
    tl.fromTo("#hero-pill-svg", { rotation: 0 }, { rotation: 90, duration: 0.6, ease: "back.out(1.5)" }, 3.8);
    tl.to("#w-off", { opacity: 0, filter: "blur(8px)", duration: 0.13, ease: "power2.in" }, 3.8);
    tl.fromTo("#w-on", IN, { ...LANDED, duration: 0.16, ease: "power3.out" }, 3.9);
    tl.fromTo("#roll-col", { yPercent: 0 }, { yPercent: -50, duration: 0.28, ease: "power3.out" }, 3.85);
    tl.fromTo("#glow-a", { opacity: 0.55 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 3.8);
    tl.fromTo("#cap-a", IN, { ...LANDED, duration: 0.2, ease: "power4.out" }, 4.35);

    // 5–8 с: снова меню, «Запретить на время» → «1 час»
    tl.set(["#st-off", "#tg-off"], { opacity: 0 }, 5.0);
    tl.set(["#st-on", "#tg-on"], { opacity: 1 }, 5.0);
    tl.to("#cursor", { x: 1394, y: 42, duration: 0.55, ease: "power3.inOut" }, 5.25);
    click(5.85);
    tl.set("#pill-hl", { opacity: 1 }, 5.88);
    tl.fromTo("#menu", { opacity: 0, y: -6 }, { opacity: 1, y: 0, duration: 0.14, ease: "expo.out", immediateRender: false }, 5.9);
    tl.to("#cursor", { x: 1560, y: 233, duration: 0.45, ease: "power2.inOut" }, 6.2);
    tl.set("#hl-timed", { opacity: 1 }, 6.55);
    tl.fromTo("#submenu", { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "power2.out" }, 6.75);
    tl.to("#cursor", { x: 1180, y: 333, duration: 0.55, ease: "power2.inOut" }, 6.95);
    tl.set("#hl-hour", { opacity: 1 }, 7.38);
    click(7.7);
    tl.set("#hl-hour", { opacity: 0 }, 7.75);
    tl.set("#hl-hour", { opacity: 1 }, 7.82);
    tl.to(["#menu", "#submenu"], { opacity: 0, duration: 0.14, ease: "power2.in" }, 7.9);
    tl.set("#pill-hl", { opacity: 0 }, 8.04);
    tl.set(["#hl-timed", "#hl-hour"], { opacity: 0 }, 8.06);

    // 8–11 с: таймер на час, финальная строка держится до конца
    tl.fromTo("#chip", { opacity: 0, filter: "blur(8px)", x: -12 }, { opacity: 1, filter: "blur(0px)", x: 0, duration: 0.35, ease: "expo.out" }, 8.1);
    tl.to("#cap-a", { opacity: 0, filter: "blur(8px)", duration: 0.15, ease: "power2.in" }, 8.05);
    tl.fromTo("#cap-b", IN, { ...LANDED, duration: 0.2, ease: "power4.out" }, 8.2);
    tl.to("#cursor", { opacity: 0, x: 1290, y: 470, duration: 0.45, ease: "power3.in" }, 8.6);

    window.__timelines["demo"] = tl;
  </script>
